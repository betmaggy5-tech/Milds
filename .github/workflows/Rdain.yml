name: VM Setup Workflow

on:
  workflow_dispatch:
    inputs:
      connection_method:
        description: "Choose connection method (tailscale/ngrok/bore)"
        required: true
        default: "tailscale"

      runtime:
        description: "Session runtime in minutes"
        required: true
        default: "360"

jobs:
  setup-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Connection (Tailscale or Ngrok or Bore)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          NGROK_AUTH: ${{ secrets.NGROK_AUTH }}
        run: |
          METHOD="${{ github.event.inputs.connection_method }}"

          if [ "$METHOD" = "tailscale" ]; then
            curl -fsSL https://tailscale.com/install.sh | sudo sh

            sudo tailscale up \
              --authkey "$TAILSCALE_AUTHKEY" \
              --hostname "mac-vm-${{ github.run_id }}" \
              --accept-routes \
              --accept-dns=false

            TS_IP=$(sudo tailscale ip -4 | head -n1)

            echo "CONNECTION_IP=$TS_IP" >> $GITHUB_ENV
            echo "CONNECTION_TYPE=Tailscale" >> $GITHUB_ENV

          elif [ "$METHOD" = "ngrok" ]; then
            wget -q -O ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip

            unzip -q ngrok.zip

            sudo mv ngrok /usr/local/bin/

            ngrok config add-authtoken "$NGROK_AUTH"

            echo "CONNECTION_TYPE=Ngrok" >> $GITHUB_ENV

          elif [ "$METHOD" = "bore" ]; then
            cargo install bore-cli

            echo "$HOME/.cargo/bin" >> $GITHUB_PATH

            echo "CONNECTION_TYPE=Bore" >> $GITHUB_ENV

          else
            echo "Invalid connection method"
            exit 1
          fi

      - name: Install Desktop Environment
        run: |
          sudo apt-get update -qq

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 \
            xfce4-goodies \
            xorg \
            dbus-x11 \
            x11-xserver-utils \
            wget \
            curl \
            unzip \
            jq \
            p7zip-full \
            qemu-system-x86 \
            ovmf \
            python3-pip

      - name: Install RustDesk
        run: |
          wget -q https://github.com/rustdesk/rustdesk/releases/download/1.3.8/rustdesk-1.3.8-x86_64.deb

          sudo apt-get install -y ./rustdesk-1.3.8-x86_64.deb

      - name: Install Additional Tools
        run: |
          pip install internetarchive

          git clone https://github.com/stck-lzm/badown ~/badown

          chmod +x ~/badown/badown

      - name: Download macOS-Simple-KVM archive
        env:
          SRC: "https://www.mediafire.com/file/insfa1o9yt48jp4/macOS-Simple-KVM.7z"
          FILE_PATH: "/mnt/macOS-Simple-KVM.7z"
        run: |
          cd ~/badown

          sudo ./badown "$SRC"

          DOWNLOADED=$(ls -t | head -n1)

          sudo mv "$DOWNLOADED" "$FILE_PATH"

      - name: Extract macOS-Simple-KVM archive
        run: |
          cd /mnt

          sudo 7z x macOS-Simple-KVM.7z -o/mnt -y

          sudo rm -f /mnt/macOS-Simple-KVM.7z

          sudo rm -f /mnt/macOS-Simple-KVM/basic.sh

          sudo wget -q -O /mnt/macOS-Simple-KVM/basic.sh \
            https://gitlab.com/MR.English2008/Mega_Gen/-/raw/main/basic.sh

          sudo chmod +x /mnt/macOS-Simple-KVM/basic.sh

      - name: Start Virtual Display
        run: |
          nohup Xvfb :1 -screen 0 1920x1080x24 >/tmp/xvfb.log 2>&1 &

          echo "DISPLAY=:1" >> $GITHUB_ENV

          sleep 5

      - name: Start XFCE Desktop
        run: |
          export DISPLAY=:1

          nohup startxfce4 >/tmp/xfce.log 2>&1 &

          sleep 15

      - name: Start macOS VM
        run: |
          export DISPLAY=:1

          cd /mnt/macOS-Simple-KVM

          sudo chmod +x basic.sh

          nohup sudo ./basic.sh >/tmp/macos.log 2>&1 &

          sleep 120

      - name: Start RustDesk
        run: |
          export DISPLAY=:1

          PASSWORD="123456"

          mkdir -p ~/.config/rustdesk

          nohup rustdesk >/tmp/rustdesk.log 2>&1 &

          sleep 30

          RD_ID=$(rustdesk --get-id 2>/dev/null | head -n1)

          if [ -z "$RD_ID" ]; then
            RD_ID=$(grep -Eo '[0-9]{8,12}' /tmp/rustdesk.log | head -n1)
          fi

          echo "RUSTDESK_ID=$RD_ID" >> $GITHUB_ENV
          echo "RUSTDESK_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Display RustDesk Connection Info and Keep Session Alive
        run: |
          echo "=== RUSTDESK CONNECTION INFORMATION ==="

          echo
          echo "Connection Method: ${{ env.CONNECTION_TYPE }}"
          echo "Selected Program: RustDesk"
          echo

          if [ "${{ env.CONNECTION_TYPE }}" = "Tailscale" ]; then
            echo "Tailscale IP:"
            sudo tailscale ip -4 || true
            echo
          fi

          echo "RustDesk ID:"
          echo "${{ env.RUSTDESK_ID }}"
          echo

          echo "Password:"
          echo "${{ env.RUSTDESK_PASSWORD }}"
          echo

          echo ">>> Connect using RustDesk client"
          echo

          RUNTIME="${{ github.event.inputs.runtime }}"

          sleep $((RUNTIME * 60))

          echo "Session ended after $RUNTIME minutes."
