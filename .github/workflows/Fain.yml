name: RustDesk VM Workflow

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: "Session runtime in minutes"
        required: true
        default: "360"

jobs:
  setup-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh

          sudo tailscale up \
            --authkey "$TAILSCALE_AUTHKEY" \
            --hostname "rustdesk-vm-${{ github.run_id }}" \
            --accept-routes \
            --accept-dns=false

          TS_IP=$(sudo tailscale ip -4 | head -n1)

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Install Desktop Environment
        run: |
          sudo apt-get update -qq

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 \
            xfce4-goodies \
            xorg \
            dbus-x11 \
            x11-xserver-utils \
            xvfb \
            wget \
            curl \
            unzip \
            jq

      - name: Start Virtual Display
        run: |
          nohup Xvfb :1 -screen 0 1920x1080x24 >/tmp/xvfb.log 2>&1 &

          echo "DISPLAY=:1" >> $GITHUB_ENV

          sleep 10

      - name: Start XFCE Desktop
        run: |
          export DISPLAY=:1

          nohup startxfce4 >/tmp/xfce.log 2>&1 &

          sleep 15

      - name: Install RustDesk
        run: |
          wget -q https://github.com/rustdesk/rustdesk/releases/download/1.3.8/rustdesk-1.3.8-x86_64.deb

          sudo apt-get install -y ./rustdesk-1.3.8-x86_64.deb

      - name: Configure RustDesk
        run: |
          export DISPLAY=:1

          PASSWORD="123456"

          mkdir -p ~/.config/rustdesk

          nohup rustdesk >/tmp/rustdesk.log 2>&1 &

          sleep 20

          rustdesk --password "$PASSWORD"

          sleep 5

          RD_ID=$(rustdesk --get-id 2>/dev/null | head -n1)

          if [ -z "$RD_ID" ]; then
            RD_ID=$(grep -Eo '[0-9]{8,12}' /tmp/rustdesk.log | head -n1)
          fi

          echo "RUSTDESK_ID=$RD_ID" >> $GITHUB_ENV
          echo "RUSTDESK_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Check RustDesk Logs
        run: |
          echo "===== RUSTDESK LOG ====="

          cat /tmp/rustdesk.log || true

      - name: Display RustDesk Connection Info
        run: |
          echo "=== RUSTDESK CONNECTION INFORMATION ==="

          echo
          echo "Connection Method: Tailscale"
          echo "Selected Program: RustDesk"
          echo

          echo "Tailscale IP:"
          echo "${{ env.TAILSCALE_IP }}"
          echo

          echo "RustDesk ID:"
          echo "${{ env.RUSTDESK_ID }}"
          echo

          echo "Password:"
          echo "${{ env.RUSTDESK_PASSWORD }}"
          echo

          echo ">>> Connect using RustDesk"
          echo

          echo "IMPORTANT:"
          echo "You must login in RustDesk client with Google/GitHub"
          echo "before connecting to public servers."

      - name: Keep Session Alive
        run: |
          RUNTIME="${{ github.event.inputs.runtime }}"

          sleep $((RUNTIME * 60))

          echo "Session ended after $RUNTIME minutes."
